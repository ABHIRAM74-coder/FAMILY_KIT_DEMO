<!DOCTYPE html>   
<html lang="en">   
<head>   
    <meta charset="UTF-8">   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">   
    <title>My Family</title>   

    <style>    

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .main {   
            display: flex;   
            justify-content: center;   
            padding: 20px;   
        }   

        .Container { 
            width: 90%; 
            max-width: 1200px;

            min-height: 600px;

            padding: 30px;

            background-color: lightgray;
            border-radius: 10px;

            box-sizing: border-box;
        } 

        .title { 
            color: blue; 
            font-size: 30px; 
            margin: 0; 
            text-align: left; 
        } 

        .images {   
            display: flex;   
            justify-content: center;   
            align-items: flex-start;   

            gap: 60px;

            margin-top: 80px;

            flex-wrap: wrap;
        }   

        .person {  
            display: flex;  
            flex-direction: column;  
            align-items: center;

            width: 220px;
        }  

        img {   
            width: 150px;   
            height: 150px;   

            border: 1px solid blue;   
            border-radius: 50%;   

            object-fit: cover;   
        }   

        h1 {   
            font-size: 22px;   
            color: black;   
            text-align: center;   
            margin-top: 15px;  
        }   


        /* MOBILE VIEW */

        @media (max-width: 600px) {

            .main {
                padding: 10px;
            }

            .Container {
                width: 100%;
                padding: 20px;

                min-height: auto;
            }

            .title {
                font-size: 24px;
            }

            .images {
                flex-direction: column;

                align-items: center;

                gap: 30px;

                margin-top: 40px;
            }

            .person {
                width: 100%;
            }

            img {
                width: 120px;
                height: 120px;
            }

            h1 {
                font-size: 18px;
            }
        }

    </style>   
</head>   

<body>   

<div class="main">   

    <div class="Container"> 

        <h2 class="title">MYFAMILY</h2> 

        <div class="images">   

            <div class="person">  

                <img   
                    src="Screenshot 2026-10-02 204944.png"  
                    alt="V V Praveen Kumar">  

                <h1>V V PRAVEEN KUMAR</h1>  

            </div>  


            <div class="person">  

                <img  
                    src="Screenshot 2026-10-02 205402.png"  
                    alt="V Manjeera Bhargavi">  

                <h1>V MANJEERA BHARGAVI</h1>  

            </div>  


            <div class="person">  

                <img  
                    src="Screenshot 2026-10-02 205541.png"  
                    alt="V V S Abhiram">  

                <h1>V V S ABHIRAM</h1>  

            </div>  

        </div>   

    </div>   

</div>   

</body>   
</html>
